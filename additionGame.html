<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fun Addition Game 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #FFF9F0;
    --yellow: #FFD93D;
    --orange: #FF6B35;
    --pink: #FF6B9D;
    --green: #6BCB77;
    --blue: #4D96FF;
    --purple: #C77DFF;
    --red: #FF595E;
    --card: #FFFFFF;
    --shadow: rgba(0,0,0,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--sky);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* Floating background shapes */
  .bg-shape {
    position: fixed;
    border-radius: 50%;
    opacity: 0.12;
    pointer-events: none;
    animation: floatBg 8s ease-in-out infinite;
  }
  .bg-shape:nth-child(1) { width:200px;height:200px;background:var(--pink);top:5%;left:5%;animation-delay:0s; }
  .bg-shape:nth-child(2) { width:150px;height:150px;background:var(--blue);top:20%;right:8%;animation-delay:1.5s; }
  .bg-shape:nth-child(3) { width:120px;height:120px;background:var(--yellow);bottom:15%;left:10%;animation-delay:3s; }
  .bg-shape:nth-child(4) { width:180px;height:180px;background:var(--green);bottom:10%;right:5%;animation-delay:2s; }

  @keyframes floatBg {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.05); }
  }

  header {
    text-align: center;
    padding: 24px 16px 10px;
  }

  header h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 6vw, 3.2rem);
    color: var(--orange);
    text-shadow: 3px 3px 0 rgba(255,107,53,0.2);
    letter-spacing: 1px;
  }

  header p {
    font-size: clamp(0.95rem, 2.5vw, 1.15rem);
    color: #888;
    margin-top: 4px;
    font-weight: 700;
  }

  /* Score bar */
  .scorebar {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 12px auto;
    max-width: 480px;
    padding: 0 16px;
  }

  .score-pill {
    background: white;
    border-radius: 50px;
    padding: 8px 22px;
    font-weight: 900;
    font-size: 1rem;
    box-shadow: 0 4px 12px var(--shadow);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .score-pill span { font-size: 1.3rem; }

  /* Main game card */
  .game-card {
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 8px 32px var(--shadow);
    max-width: 560px;
    margin: 0 auto 24px;
    padding: 28px 24px 24px;
    position: relative;
    overflow: hidden;
  }

  .game-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--pink), var(--yellow), var(--green), var(--blue));
    border-radius: 28px 28px 0 0;
  }

  /* Question label */
  .question-label {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.5rem, 4vw, 2rem);
    color: #444;
    text-align: center;
    margin-bottom: 20px;
  }

  .question-label .num {
    display: inline-block;
    background: var(--yellow);
    color: #333;
    border-radius: 12px;
    padding: 2px 14px;
    margin: 0 4px;
  }

  .question-label .plus {
    color: var(--orange);
    font-size: 1.8rem;
  }

  /* Object groups */
  .groups {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  .group-box {
    background: #F9F9FF;
    border: 3px dashed #DDD;
    border-radius: 20px;
    padding: 14px 18px;
    min-width: 110px;
    min-height: 90px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    justify-content: center;
    flex: 1;
    max-width: 200px;
    transition: border-color 0.3s;
  }

  .group-box.a { border-color: #FFB3CC; background: #FFF5F8; }
  .group-box.b { border-color: #B3D9FF; background: #F5F9FF; }

  .obj {
    font-size: clamp(1.6rem, 5vw, 2.2rem);
    display: inline-block;
    cursor: default;
    user-select: none;
    animation: popIn 0.35s cubic-bezier(.68,-0.55,.27,1.55) both;
    transition: transform 0.15s;
    line-height: 1;
  }

  .obj:hover { transform: scale(1.25) rotate(-5deg); }

  @keyframes popIn {
    from { transform: scale(0) rotate(-15deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg);  opacity: 1; }
  }

  .plus-sign {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 6vw, 2.8rem);
    color: var(--orange);
    align-self: center;
    flex-shrink: 0;
  }

  .equals-row {
    text-align: center;
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.4rem, 4vw, 1.8rem);
    color: #666;
    margin-bottom: 18px;
  }

  /* Answer buttons */
  .answers {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 10px;
  }

  .ans-btn {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.4rem, 4vw, 2rem);
    border: none;
    border-radius: 16px;
    padding: 14px 8px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 5px 0 rgba(0,0,0,0.15);
    color: white;
    position: relative;
    overflow: hidden;
  }

  .ans-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 0 rgba(0,0,0,0.15); }
  .ans-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }

  .ans-btn:nth-child(1) { background: var(--blue); }
  .ans-btn:nth-child(2) { background: var(--pink); }
  .ans-btn:nth-child(3) { background: var(--green); }
  .ans-btn:nth-child(4) { background: var(--purple); }

  .ans-btn.correct {
    background: var(--green) !important;
    animation: correctPop 0.5s ease;
  }

  .ans-btn.wrong {
    background: var(--red) !important;
    animation: shake 0.4s ease;
  }

  @keyframes correctPop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-8px); }
    75%     { transform: translateX(8px); }
  }

  /* Feedback */
  .feedback {
    text-align: center;
    font-family: 'Fredoka One', cursive;
    font-size: clamp(1.3rem, 4vw, 1.7rem);
    min-height: 42px;
    margin-top: 8px;
    transition: all 0.3s;
  }

  .feedback.yay  { color: var(--green); }
  .feedback.oops { color: var(--red); }

  /* Next button */
  .next-btn {
    display: block;
    margin: 14px auto 0;
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    background: var(--orange);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 14px 40px;
    cursor: pointer;
    box-shadow: 0 6px 0 #c4521e;
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.5px;
  }

  .next-btn:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #c4521e; }
  .next-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c4521e; }
  .next-btn.hidden { display: none; }

  /* Celebration overlay */
  .celebrate {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.92);
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    animation: fadeIn 0.4s ease;
  }

  .celebrate.hidden { display: none; }

  @keyframes fadeIn { from {opacity:0} to {opacity:1} }

  .celebrate h2 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 7vw, 3.5rem);
    color: var(--orange);
    text-align: center;
    line-height: 1.2;
  }

  .celebrate p {
    font-size: clamp(1rem, 3vw, 1.3rem);
    color: #666;
    font-weight: 700;
    text-align: center;
  }

  .celebrate .big-emoji {
    font-size: clamp(4rem, 12vw, 7rem);
    animation: bounce 0.7s ease infinite alternate;
  }

  @keyframes bounce {
    from { transform: translateY(0); }
    to   { transform: translateY(-18px); }
  }

  .play-again-btn {
    font-family: 'Fredoka One', cursive;
    font-size: 1.4rem;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 16px 44px;
    cursor: pointer;
    box-shadow: 0 6px 0 #49a854;
    transition: transform 0.15s;
    margin-top: 8px;
  }

  .play-again-btn:hover { transform: scale(1.05); }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    width: 10px; height: 10px;
    border-radius: 2px;
    opacity: 0;
    pointer-events: none;
    animation: confettiFall 2.5s ease-in forwards;
    z-index: 200;
  }

  @keyframes confettiFall {
    0%   { opacity: 1; transform: translateY(-20px) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
  }

  /* Progress dots */
  .progress-dots {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 18px;
  }

  .dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #E0E0E0;
    transition: background 0.3s, transform 0.3s;
  }

  .dot.done { background: var(--green); transform: scale(1.2); }
  .dot.current { background: var(--yellow); transform: scale(1.3); }
</style>
</head>
<body>

<div class="bg-shape"></div>
<div class="bg-shape"></div>
<div class="bg-shape"></div>
<div class="bg-shape"></div>

<header>
  <h1>🍭 Let's Add! 🍭</h1>
  <p>Count the objects and find the answer!</p>
</header>

<div class="scorebar">
  <div class="score-pill"><span>⭐</span> Stars: <b id="score">0</b></div>
  <div class="score-pill"><span>🎯</span> Question: <b id="qnum">1</b> / 8</div>
</div>

<div class="game-card" id="gameCard">
  <div class="progress-dots" id="dots"></div>
  <div class="question-label" id="questionLabel"></div>
  <div class="groups">
    <div class="group-box a" id="groupA"></div>
    <div class="plus-sign">+</div>
    <div class="group-box b" id="groupB"></div>
  </div>
  <div class="equals-row">How many altogether? 🤔</div>
  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn hidden" id="nextBtn" onclick="nextQuestion()">Next ➡️</button>
</div>

<!-- Celebration screen -->
<div class="celebrate hidden" id="celebrateScreen">
  <div class="big-emoji" id="celebEmoji">🎉</div>
  <h2 id="celebTitle">Amazing job!</h2>
  <p id="celebMsg">You got <b id="finalScore">0</b> out of 8 stars! ⭐</p>
  <button class="play-again-btn" onclick="startGame()">Play Again 🔄</button>
</div>

<script>
const EMOJIS = [
  ['🍎','🍊','🍋','🍇','🍓'],
  ['🐶','🐱','🐭','🐹','🐰'],
  ['🚗','🚕','🚙','🚌','🚎'],
  ['⭐','🌟','💫','✨','🌙'],
  ['🎈','🎉','🎊','🎀','🎁'],
  ['🦁','🐯','🐻','🐼','🐨'],
  ['🍦','🍭','🍬','🍫','🍩'],
  ['🌸','🌺','🌻','🌹','🌷']
];

let currentQ = 0;
let score = 0;
let questions = [];
let answered = false;
const TOTAL = 8;

function generateQuestions() {
  questions = [];
  for (let i = 0; i < TOTAL; i++) {
    const a = Math.floor(Math.random() * 5) + 1;  // 1-5
    const b = Math.floor(Math.random() * 5) + 1;  // 1-5
    const emoji = EMOJIS[i % EMOJIS.length];
    questions.push({ a, b, emoji });
  }
}

function getWrongAnswers(correct) {
  const wrongs = new Set();
  while (wrongs.size < 3) {
    let w = correct + Math.floor(Math.random() * 7) - 3;
    if (w !== correct && w >= 1 && w <= 12) wrongs.add(w);
  }
  return [...wrongs];
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function buildDots() {
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < currentQ ? ' done' : i === currentQ ? ' current' : '');
    dots.appendChild(d);
  }
}

function renderQuestion() {
  answered = false;
  const q = questions[currentQ];
  document.getElementById('qnum').textContent = currentQ + 1;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').classList.add('hidden');
  buildDots();

  // Question label
  document.getElementById('questionLabel').innerHTML =
    `<span class="num">${q.a}</span><span class="plus"> + </span><span class="num">${q.b}</span> = ?`;

  // Group A objects
  const gA = document.getElementById('groupA');
  gA.innerHTML = '';
  for (let i = 0; i < q.a; i++) {
    const el = document.createElement('span');
    el.className = 'obj';
    el.textContent = q.emoji[0];
    el.style.animationDelay = (i * 0.07) + 's';
    gA.appendChild(el);
  }

  // Group B objects
  const gB = document.getElementById('groupB');
  gB.innerHTML = '';
  for (let i = 0; i < q.b; i++) {
    const el = document.createElement('span');
    el.className = 'obj';
    el.textContent = q.emoji[1] || q.emoji[0];
    el.style.animationDelay = (i * 0.07) + 's';
    gB.appendChild(el);
  }

  // Answer buttons
  const correct = q.a + q.b;
  const options = shuffle([correct, ...getWrongAnswers(correct)]);
  const answersDiv = document.getElementById('answers');
  answersDiv.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(opt, correct, btn);
    answersDiv.appendChild(btn);
  });
}

function checkAnswer(selected, correct, btn) {
  if (answered) return;
  answered = true;

  const allBtns = document.querySelectorAll('.ans-btn');
  allBtns.forEach(b => b.style.pointerEvents = 'none');

  if (selected === correct) {
    btn.classList.add('correct');
    score++;
    document.getElementById('score').textContent = score;
    document.getElementById('feedback').textContent = pickYay();
    document.getElementById('feedback').className = 'feedback yay';
    spawnConfetti(5);
  } else {
    btn.classList.add('wrong');
    // highlight correct
    allBtns.forEach(b => { if (+b.textContent === correct) b.classList.add('correct'); });
    document.getElementById('feedback').textContent = pickOops();
    document.getElementById('feedback').className = 'feedback oops';
  }

  if (currentQ < TOTAL - 1) {
    document.getElementById('nextBtn').classList.remove('hidden');
  } else {
    setTimeout(showCelebration, 1200);
  }
}

function nextQuestion() {
  currentQ++;
  renderQuestion();
}

function pickYay() {
  const msgs = ['🎉 Yay! Correct!', '⭐ Super Star!', '🌟 Amazing!', '🎊 Brilliant!', '🏆 You got it!', '🥳 Fantastic!'];
  return msgs[Math.floor(Math.random() * msgs.length)];
}

function pickOops() {
  const msgs = ['😊 Try next one!', '💪 Good try!', '🌈 Almost there!', '🤗 Keep going!'];
  return msgs[Math.floor(Math.random() * msgs.length)];
}

function showCelebration() {
  const screen = document.getElementById('celebrateScreen');
  screen.classList.remove('hidden');
  document.getElementById('finalScore').textContent = score;

  if (score >= 7) {
    document.getElementById('celebEmoji').textContent = '🏆';
    document.getElementById('celebTitle').textContent = 'WOW! You\'re a Star!';
  } else if (score >= 5) {
    document.getElementById('celebEmoji').textContent = '🎉';
    document.getElementById('celebTitle').textContent = 'Great Job!';
  } else {
    document.getElementById('celebEmoji').textContent = '💪';
    document.getElementById('celebTitle').textContent = 'Keep Practicing!';
  }

  spawnConfetti(30);
}

function spawnConfetti(n) {
  const colors = ['#FFD93D','#FF6B35','#FF6B9D','#6BCB77','#4D96FF','#C77DFF'];
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.top = '-10px';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (1.5 + Math.random()) + 's';
      c.style.animationDelay = (Math.random() * 0.5) + 's';
      c.style.width = (8 + Math.random() * 8) + 'px';
      c.style.height = (8 + Math.random() * 8) + 'px';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3000);
    }, i * 60);
  }
}

function startGame() {
  currentQ = 0;
  score = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('celebrateScreen').classList.add('hidden');
  generateQuestions();
  renderQuestion();
}

// Kick off!
startGame();
</script>
</body>
</html>
