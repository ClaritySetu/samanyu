<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hindi Letter Hunt</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background-color: #009432; 
            background-image: radial-gradient(#006266 2px, transparent 2px);
            background-size: 40px 40px;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: manipulation;
        }

        .instruction {
            position: absolute; top: 15px; width: 100%;
            text-align: center; color: #FFC312;
            font-size: 28px; font-weight: 900;
            text-shadow: 3px 3px 0px #000;
            z-index: 100;
        }

        .letter-bubble {
            position: absolute;
            width: 130px; height: 130px;
            border-radius: 50%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 12px 0 rgba(0,0,0,0.3);
            border: 8px solid #fff;
            /* Using transition for smoother return after animation */
            transition: transform 0.2s, box-shadow 0.2s;
            will-change: transform;
        }

        .char { font-size: 4.8rem; font-weight: 900; line-height: 1; pointer-events: none; }
        .object { font-size: 1.8rem; margin-top: -5px; pointer-events: none; }

        /* Colors */
        .c-red { background-color: #eb4d4b; color: #fff; }
        .c-blue { background-color: #0984e3; color: #fff; }
        .c-yellow { background-color: #f1c40f; color: #2d3436; }
        .c-purple { background-color: #6c5ce7; color: #fff; }
        .c-orange { background-color: #e67e22; color: #fff; }

        /* Zoom Animation */
        @keyframes superZoom {
            0% { transform: scale(1); }
            50% { transform: scale(1.8) rotate(10deg); }
            100% { transform: scale(1); }
        }

        .animating { 
            animation: superZoom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) !important;
            z-index: 1000 !important; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
        }

        @keyframes float {
            0%, 100% { margin-top: 0; margin-left: 0; }
            50% { margin-top: -10px; margin-left: 5px; }
        }
    </style>
</head>
<body>

    <div class="instruction">TAP A LETTER!</div>
    <div id="play-area" style="position: relative; width: 100%; height: 100%;"></div>

    <script>
        const data = [
            { h: 'क', o: '🪷', c: 'c-red' },
            { h: 'स', o: '🍎', c: 'c-blue' },
            { h: 'च', o: '🥄', c: 'c-yellow' },
            { h: 'ज', o: '🚢', c: 'c-purple' },
            { h: 'ट', o: '🍅', c: 'c-orange' },
            { h: 'न', o: '🚰', c: 'c-red' },
            { h: 'प', o: '🪁', c: 'c-blue' },
            { h: 'ब', o: '🦆', c: 'c-yellow' },
            { h: 'म', o: '🐟', c: 'c-purple' },
            { h: 'ल', o: '🍬', c: 'c-orange' }
        ];

        function speak(text) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'hi-IN';
            msg.rate = 0.7; 
            window.speechSynthesis.speak(msg);
        }

        const area = document.getElementById('play-area');

        function setupGame() {
            area.innerHTML = '';
            const cols = 4;
            const rows = 3;
            const slots = [];
            
            for(let r=0; r<rows; r++) {
                for(let c=0; c<cols; c++) {
                    slots.push({ r, c });
                }
            }

            const shuffledSlots = slots.sort(() => Math.random() - 0.5).slice(0, 10);

            data.forEach((item, i) => {
                const bubble = document.createElement('div');
                bubble.className = `letter-bubble ${item.c}`;
                
                const slot = shuffledSlots[i];
                const cellWidth = window.innerWidth / cols;
                const cellHeight = window.innerHeight / rows;

                const jitterX = (Math.random() - 0.5) * (cellWidth * 0.3);
                const jitterY = (Math.random() - 0.5) * (cellHeight * 0.3);
                
                const posX = (slot.c * cellWidth) + (cellWidth / 2) - 65 + jitterX;
                const posY = (slot.r * cellHeight) + (cellHeight / 2) - 65 + jitterY;

                bubble.style.left = `${Math.max(10, Math.min(posX, window.innerWidth - 140))}px`;
                bubble.style.top = `${Math.max(60, Math.min(posY, window.innerHeight - 150))}px`;
                
                // Moved float to separate animation to avoid transform conflicts
                bubble.style.animation = `float ${3 + Math.random()}s ease-in-out infinite`;

                bubble.innerHTML = `<div class="char">${item.h}</div><div class="object">${item.o}</div>`;

                bubble.onclick = (e) => {
                    // Prevent overlapping clicks
                    if (bubble.classList.contains('animating')) return;
                    
                    bubble.classList.add('animating');
                    speak(item.h);
                    
                    confetti({
                        particleCount: 40, spread: 60,
                        origin: { 
                            x: (parseInt(bubble.style.left) + 65) / window.innerWidth,
                            y: (parseInt(bubble.style.top) + 65) / window.innerHeight 
                        }
                    });

                    // Remove class after animation finishes
                    setTimeout(() => {
                        bubble.classList.remove('animating');
                    }, 500);
                };

                area.appendChild(bubble);
            });
        }

        window.onload = setupGame;
        let resizeTimer;
        window.onresize = () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(setupGame, 200);
        };
    </script>
</body>
</html>
