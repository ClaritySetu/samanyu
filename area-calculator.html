<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interior Design Area Tracker</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8f9fa; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: sticky; top: 0; background: #f8f9fa; padding: 10px 0; z-index: 10; border-bottom: 1px solid #ddd; }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border: 1px solid #eee; }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .component-name { font-weight: bold; border: none; border-bottom: 1px dashed #ccc; font-size: 1.1rem; width: 70%; outline: none; }
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 10px; }
        .unit-group { display: flex; gap: 5px; align-items: center; }
        label { font-size: 0.8rem; color: #666; display: block; margin-bottom: 4px; }
        input[type="number"] { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
        .item-result { margin-top: 10px; font-weight: 600; color: #007bff; text-align: right; }
        .btn-add { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-delete { background: #ff4d4d; color: white; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; font-size: 0.8rem; }
        .total-box { background: #343a40; color: white; padding: 20px; border-radius: 12px; margin-top: 20px; text-align: center; font-size: 1.3rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Interior Planner</h2>
        <button class="btn-add" onclick="addComponent()">+ Add Item</button>
    </div>

    <div id="component-list"></div>

    <div class="total-box">
        Total Area: <span id="grand-total">0.00</span> sq. ft.
    </div>
</div>

<script>
    let components = JSON.parse(localStorage.getItem('interiorData')) || [];

    function save() {
        localStorage.setItem('interiorData', JSON.stringify(components));
        render();
    }

    function addComponent() {
        components.push({ id: Date.now(), name: 'New Component', lFt: 0, lIn: 0, wFt: 0, wIn: 0 });
        save();
    }

    function updateValue(id, field, value) {
        const item = components.find(c => c.id === id);
        if (field === 'name') item[field] = value;
        else item[field] = parseFloat(value) || 0;
        save();
    }

    function deleteComponent(id) {
        components = components.filter(c => c.id !== id);
        save();
    }

    function render() {
        const list = document.getElementById('component-list');
        list.innerHTML = '';
        let grandTotal = 0;

        components.forEach(item => {
            const area = (item.lFt + (item.lIn / 12)) * (item.wFt + (item.wIn / 12));
            grandTotal += area;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-header">
                    <input class="component-name" value="${item.name}" onchange="updateValue(${item.id}, 'name', this.value)">
                    <button class="btn-delete" onclick="deleteComponent(${item.id})">Remove</button>
                </div>
                <div class="input-row">
                    <div>
                        <label>Length</label>
                        <div class="unit-group">
                            <input type="number" placeholder="Ft" value="${item.lFt}" oninput="updateValue(${item.id}, 'lFt', this.value)">
                            <input type="number" placeholder="In" value="${item.lIn}" oninput="updateValue(${item.id}, 'lIn', this.value)">
                        </div>
                    </div>
                    <div>
                        <label>Width</label>
                        <div class="unit-group">
                            <input type="number" placeholder="Ft" value="${item.wFt}" oninput="updateValue(${item.id}, 'wFt', this.value)">
                            <input type="number" placeholder="In" value="${item.wIn}" oninput="updateValue(${item.id}, 'wIn', this.value)">
                        </div>
                    </div>
                </div>
                <div class="item-result">${area.toFixed(2)} sq. ft.</div>
            `;
            list.appendChild(card);
        });

        document.getElementById('grand-total').innerText = grandTotal.toFixed(2);
    }

    render();
</script>

</body>
</html>
