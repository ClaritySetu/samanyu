<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Calculator (Ft/In)</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 320px; }
        h2 { margin-top: 0; font-size: 1.2rem; color: #333; }
        .input-group { margin-bottom: 1.5rem; }
        .row { display: flex; gap: 10px; margin-top: 5px; }
        label { font-size: 0.9rem; font-weight: bold; color: #555; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 1.5rem; padding: 10px; background: #e9ecef; border-radius: 4px; text-align: center; font-weight: bold; min-height: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Area Calculator</h2>
    
    <div class="input-group">
        <label>Length</label>
        <div class="row">
            <input type="number" id="l_ft" placeholder="Ft" min="0">
            <input type="number" id="l_in" placeholder="In" min="0" max="11">
        </div>
    </div>

    <div class="input-group">
        <label>Width</label>
        <div class="row">
            <input type="number" id="w_ft" placeholder="Ft" min="0">
            <input type="number" id="w_in" placeholder="In" min="0" max="11">
        </div>
    </div>

    <button onclick="calculateArea()">Calculate Area</button>

    <div id="result"></div>
</div>

<script>
    function calculateArea() {
        const lFt = parseFloat(document.getElementById('l_ft').value) || 0;
        const lIn = parseFloat(document.getElementById('l_in').value) || 0;
        const wFt = parseFloat(document.getElementById('w_ft').value) || 0;
        const wIn = parseFloat(document.getElementById('w_in').value) || 0;

        // Convert everything to decimal feet
        const totalLength = lFt + (lIn / 12);
        const totalWidth = wFt + (wIn / 12);
        const area = totalLength * totalWidth;

        document.getElementById('result').innerText = `Area: ${area.toFixed(2)} sq. ft.`;
    }
</script>

</body>
</html>
