<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✖️ Groups & Multiplication!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #a8dff5;
    --sky-bot: #d4f1ff;
    --grass: #5ec44a;
    --grass-dark: #46a834;
    --navy: #1a1a4e;
    --orange: #FF7043;
    --pink: #FF6B9D;
    --green: #4CAF50;
    --teal: #26C6DA;
    --blue: #42A5F5;
    --purple: #AB47BC;
    --red: #EF5350;
    --yellow: #FFD93D;
    --lime: #9CCC65;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 68%);
    overflow-x: hidden;
    position: relative;
  }

  /* ── Sky ── */
  .sun {
    position: fixed; top: 20px; right: 48px;
    width: 82px; height: 82px;
    background: radial-gradient(circle, #ffe566 60%, #FFD93D 100%);
    border-radius: 50%;
    box-shadow: 0 0 0 14px rgba(255,220,60,0.2), 0 0 0 30px rgba(255,220,60,0.09);
    animation: sunPulse 4s ease-in-out infinite; z-index: 0;
  }
  @keyframes sunPulse {
    0%,100% { box-shadow: 0 0 0 14px rgba(255,220,60,0.2), 0 0 0 28px rgba(255,220,60,0.09); }
    50%      { box-shadow: 0 0 0 22px rgba(255,220,60,0.28), 0 0 0 44px rgba(255,220,60,0.12); }
  }

  .cloud {
    position: fixed; background: white; border-radius: 50px;
    opacity: 0.85; animation: driftCloud linear infinite; z-index: 0; pointer-events: none;
  }
  .cloud::before,.cloud::after { content:''; position:absolute; background:white; border-radius:50%; }
  .cloud.c1 { width:110px;height:36px;top:36px;left:-120px;animation-duration:30s; }
  .cloud.c1::before { width:52px;height:52px;top:-24px;left:14px; }
  .cloud.c1::after  { width:36px;height:36px;top:-16px;left:52px; }
  .cloud.c2 { width:80px;height:26px;top:82px;left:-90px;animation-duration:44s;animation-delay:-18s;opacity:0.6; }
  .cloud.c2::before { width:38px;height:38px;top:-18px;left:10px; }
  .cloud.c2::after  { width:26px;height:26px;top:-12px;left:38px; }
  .cloud.c3 { width:140px;height:40px;top:12px;left:-150px;animation-duration:38s;animation-delay:-9s;opacity:0.5; }
  .cloud.c3::before { width:62px;height:62px;top:-30px;left:18px; }
  .cloud.c3::after  { width:46px;height:46px;top:-22px;left:64px; }
  @keyframes driftCloud { from{transform:translateX(0)} to{transform:translateX(110vw)} }

  /* ── Grass ── */
  .grass-strip {
    position: fixed; bottom:0; left:0; right:0; height:100px;
    background: var(--grass); border-radius:55% 55% 0 0/28px 28px 0 0; z-index:0;
  }
  .grass-strip::before {
    content:''; position:absolute; top:-12px; left:0; right:0;
    height:24px; background:var(--grass-dark); border-radius:50%; opacity:0.45;
  }
  .flowers {
    position: fixed; bottom:60px; left:50%; transform:translateX(-50%);
    display:flex; gap:28px; z-index:1; font-size:1.6rem;
    animation: sway 3s ease-in-out infinite; pointer-events:none;
  }
  @keyframes sway { 0%,100%{transform:translateX(-50%) rotate(0)} 50%{transform:translateX(-50%) rotate(2deg)} }

  /* ── Page ── */
  .page { position:relative; z-index:2; min-height:100vh; padding-bottom:136px; }

  .back-btn {
    position:absolute; top:18px; left:18px;
    background:white; border:3px solid var(--navy); border-radius:50px;
    padding:9px 20px; font-family:'Fredoka One',cursive; font-size:0.95rem;
    color:var(--navy); cursor:pointer; display:flex; align-items:center; gap:7px;
    box-shadow:3px 3px 0 var(--navy); text-decoration:none;
    transition:transform 0.15s, box-shadow 0.15s; z-index:10;
  }
  .back-btn:hover { transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--navy); }

  /* ── Hero ── */
  .hero { max-width:600px; margin:0 auto; padding:84px 16px 0; text-align:center; }
  .hero-card {
    background:white; border:3px solid var(--navy); border-radius:24px;
    box-shadow:5px 5px 0 var(--navy); padding:20px 28px 16px;
    display:inline-block; width:100%;
  }
  .hero-card h1 {
    font-family:'Fredoka One',cursive; font-size:clamp(1.7rem,5vw,2.5rem);
    background:linear-gradient(135deg,#AB47BC,#FF7043,#FFD93D);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .hero-card p { font-size:0.95rem; color:#777; font-weight:700; margin-top:4px; }

  /* ── Score bar ── */
  .scorebar {
    display:flex; justify-content:center; gap:14px;
    margin:16px auto 0; max-width:500px; padding:0 16px; flex-wrap:wrap;
  }
  .score-pill {
    background:white; border:3px solid var(--navy); border-radius:50px;
    padding:8px 20px; font-family:'Fredoka One',cursive; font-size:0.95rem;
    color:var(--navy); box-shadow:3px 3px 0 var(--navy);
    display:flex; align-items:center; gap:7px;
  }
  .score-pill span { font-size:1.2rem; }

  /* ── Game card ── */
  .game-card {
    background:white; border:3px solid var(--navy); border-radius:26px;
    box-shadow:6px 6px 0 var(--navy);
    max-width:620px; margin:18px auto 0; padding:26px 20px 20px;
    position:relative; overflow:hidden;
  }
  .game-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:7px;
    background:linear-gradient(90deg,var(--purple),var(--pink),var(--orange),var(--yellow));
    border-radius:26px 26px 0 0;
  }

  /* Progress dots */
  .progress-dots { display:flex; justify-content:center; gap:9px; margin-bottom:18px; }
  .dot { width:13px; height:13px; border-radius:50%; background:#E8D5FF; border:2px solid var(--navy); transition:background 0.3s, transform 0.3s; }
  .dot.done    { background:var(--green); transform:scale(1.15); }
  .dot.current { background:var(--yellow); transform:scale(1.25); }

  /* ── Concept label ── */
  .concept-box {
    background:#FFF8E1; border:3px solid var(--yellow);
    border-radius:16px; padding:12px 18px; text-align:center;
    margin-bottom:18px;
  }
  .concept-box p {
    font-family:'Fredoka One',cursive;
    font-size:clamp(1.1rem,3.5vw,1.45rem); color:var(--navy); line-height:1.4;
  }
  .concept-box .num {
    display:inline-block; background:var(--yellow); border:2px solid var(--navy);
    border-radius:10px; padding:0 12px; margin:0 3px;
  }
  .concept-box .times { color:var(--purple); font-size:1.6rem; }

  /* ── Groups visual ── */
  .groups-area {
    display:flex; flex-wrap:wrap; gap:14px;
    justify-content:center; margin-bottom:18px;
  }

  .group-plate {
    background:white; border:3px solid var(--navy);
    border-radius:20px; padding:14px 16px;
    display:flex; flex-wrap:wrap; gap:6px;
    align-items:center; justify-content:center;
    min-width:90px; min-height:80px;
    box-shadow:4px 4px 0 var(--navy);
    animation:plateIn 0.4s cubic-bezier(.68,-0.55,.27,1.55) both;
    position:relative;
  }

  /* plate color cycling */
  .group-plate:nth-child(1) { background:#FFF5F8; border-color:#FF6B9D; box-shadow:4px 4px 0 #FF6B9D; }
  .group-plate:nth-child(2) { background:#F5F9FF; border-color:#42A5F5; box-shadow:4px 4px 0 #42A5F5; }
  .group-plate:nth-child(3) { background:#F5FFF8; border-color:#4CAF50; box-shadow:4px 4px 0 #4CAF50; }
  .group-plate:nth-child(4) { background:#FFF8E1; border-color:#FFD93D; box-shadow:4px 4px 0 #E6B800; }
  .group-plate:nth-child(5) { background:#F9F5FF; border-color:#AB47BC; box-shadow:4px 4px 0 #AB47BC; }

  /* plate number badge */
  .plate-badge {
    position:absolute; top:-12px; left:50%; transform:translateX(-50%);
    background:var(--navy); color:white;
    font-family:'Fredoka One',cursive; font-size:0.75rem;
    border-radius:50px; padding:2px 10px; white-space:nowrap;
  }

  @keyframes plateIn {
    from{opacity:0;transform:scale(0.7) rotate(-8deg)}
    to  {opacity:1;transform:scale(1) rotate(0)}
  }

  .obj {
    font-size:clamp(1.6rem,4.5vw,2rem);
    display:inline-block; user-select:none; cursor:default; line-height:1;
    animation:objPop 0.35s cubic-bezier(.68,-0.55,.27,1.55) both;
    transition:transform 0.15s;
  }
  .obj:hover { transform:scale(1.25) rotate(-8deg); }

  @keyframes objPop {
    from{transform:scale(0) rotate(-20deg);opacity:0}
    to  {transform:scale(1) rotate(0);opacity:1}
  }

  /* ── Count row ── */
  .count-row {
    text-align:center; font-family:'Fredoka One',cursive;
    font-size:clamp(1rem,3vw,1.25rem); color:#666; margin-bottom:16px;
  }
  .count-row b { color:var(--purple); }

  /* ── Answer buttons ── */
  .answers {
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:10px;
  }
  .ans-btn {
    font-family:'Fredoka One',cursive; font-size:clamp(1.4rem,4vw,2rem);
    border:none; border-radius:14px; padding:14px 6px;
    cursor:pointer; color:white;
    box-shadow:0 5px 0 rgba(0,0,0,0.18);
    transition:transform 0.15s, box-shadow 0.15s;
  }
  .ans-btn:nth-child(1){background:var(--blue);}
  .ans-btn:nth-child(2){background:var(--pink);}
  .ans-btn:nth-child(3){background:var(--green);}
  .ans-btn:nth-child(4){background:var(--purple);}
  .ans-btn:hover  { transform:translateY(-3px); box-shadow:0 8px 0 rgba(0,0,0,0.18); }
  .ans-btn:active { transform:translateY(2px);  box-shadow:0 2px 0 rgba(0,0,0,0.18); }
  .ans-btn.correct{ background:var(--green)!important; animation:correctPop 0.5s ease; }
  .ans-btn.wrong  { background:var(--red)!important;   animation:shake 0.4s ease; }
  @keyframes correctPop{ 0%{transform:scale(1)} 40%{transform:scale(1.2)} 100%{transform:scale(1)} }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }

  /* Feedback */
  .feedback {
    text-align:center; font-family:'Fredoka One',cursive;
    font-size:clamp(1.1rem,3.5vw,1.5rem); min-height:38px; margin-top:6px;
  }
  .feedback.yay  { color:var(--green); }
  .feedback.oops { color:var(--red); }

  /* Next btn */
  .next-btn {
    display:block; margin:14px auto 0;
    font-family:'Fredoka One',cursive; font-size:1.2rem;
    background:var(--orange); color:white; border:none;
    border-radius:50px; padding:13px 38px; cursor:pointer;
    box-shadow:0 6px 0 #bf4c28; transition:transform 0.15s, box-shadow 0.15s;
  }
  .next-btn:hover  { transform:translateY(-3px); box-shadow:0 9px 0 #bf4c28; }
  .next-btn:active { transform:translateY(3px);  box-shadow:0 2px 0 #bf4c28; }
  .next-btn.hidden { display:none; }

  /* ── Count-it helper button ── */
  .count-btn {
    display:block; margin:0 auto 14px;
    font-family:'Fredoka One',cursive; font-size:1rem;
    background:var(--teal); color:var(--navy); border:none;
    border-radius:50px; padding:10px 28px; cursor:pointer;
    box-shadow:0 5px 0 #0097A7; transition:transform 0.15s, box-shadow 0.15s;
  }
  .count-btn:hover  { transform:translateY(-2px); box-shadow:0 7px 0 #0097A7; }
  .count-btn:active { transform:translateY(2px);  box-shadow:0 2px 0 #0097A7; }
  .count-btn.hidden { display:none; }

  /* counting highlight — no conflicting animation property */
  .obj.highlight {
    outline: 4px solid var(--purple);
    outline-offset: 3px;
    border-radius: 6px;
    filter: drop-shadow(0 0 8px var(--purple)) brightness(1.25);
    transform: scale(1.4) !important;
    z-index: 10;
    position: relative;
  }
  .obj.counted {
    opacity: 0.35;
    filter: grayscale(0.6);
    transform: scale(0.9) !important;
  }

  /* floating number bubble that hops over each object */
  #floatBubble {
    position: fixed;
    font-family: 'Fredoka One', cursive;
    font-size: 2.2rem;
    color: white;
    background: var(--purple);
    border: 3px solid var(--navy);
    border-radius: 50%;
    width: 62px; height: 62px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 0 rgba(0,0,0,0.25), 0 0 0 4px rgba(171,71,188,0.3);
    pointer-events: none;
    z-index: 999;
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.4);
    transition: left 0.28s cubic-bezier(.68,-0.55,.27,1.55),
                top  0.28s cubic-bezier(.68,-0.55,.27,1.55),
                transform 0.22s cubic-bezier(.68,-0.55,.27,1.55),
                opacity 0.18s ease;
  }
  #floatBubble.show {
    opacity: 1;
    transform: translate(-50%, -130%) scale(1);
  }
  #floatBubble.pop {
    animation: bubblePop 0.22s ease;
  }
  @keyframes bubblePop {
    0%   { transform: translate(-50%, -130%) scale(1); }
    40%  { transform: translate(-50%, -160%) scale(1.35); }
    100% { transform: translate(-50%, -130%) scale(1); }
  }

  /* ── Celebration ── */
  .celebrate {
    position:fixed; inset:0; background:rgba(255,255,255,0.93);
    z-index:100; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    animation:fadeIn 0.4s ease;
  }
  .celebrate.hidden { display:none; }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .celebrate h2 {
    font-family:'Fredoka One',cursive; font-size:clamp(2rem,7vw,3.2rem);
    color:var(--purple); text-align:center; line-height:1.2;
  }
  .celebrate p { font-size:1.05rem; color:#666; font-weight:700; text-align:center; }
  .big-emoji { font-size:clamp(4rem,12vw,7rem); animation:bounce 0.7s ease infinite alternate; }
  @keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-18px)}}
  .play-again-btn {
    font-family:'Fredoka One',cursive; font-size:1.3rem;
    background:var(--green); color:white; border:none; border-radius:50px;
    padding:14px 40px; cursor:pointer; box-shadow:0 6px 0 #388E3C;
    transition:transform 0.15s; margin-top:6px;
  }
  .play-again-btn:hover { transform:scale(1.06); }

  /* confetti */
  .confetti-piece {
    position:fixed; border-radius:3px; opacity:0; pointer-events:none;
    animation:confettiFall 2.5s ease-in forwards; z-index:200;
  }
  @keyframes confettiFall{
    0%  {opacity:1;transform:translateY(-20px) rotate(0)}
    100%{opacity:0;transform:translateY(100vh) rotate(720deg)}
  }

  @media(max-width:480px){
    .answers{ grid-template-columns:repeat(2,1fr); }
    .groups-area{ gap:10px; }
  }
</style>
</head>
<body>

<div class="sun"></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>

<div class="page">
  <a class="back-btn" href="StudyCorner.html">← Back</a>
  <div class="hero">
    <div class="hero-card">
      <h1>✖️ Groups Game!</h1>
      <p>Count the groups and find how many altogether! 🌟</p>
    </div>
  </div>

  <div class="scorebar">
    <div class="score-pill"><span>⭐</span> Stars: <b id="score">0</b></div>
    <div class="score-pill"><span>🎯</span> Question: <b id="qnum">1</b> / 8</div>
  </div>

  <div class="game-card" id="gameCard">
    <div class="progress-dots" id="dots"></div>

    <!-- Concept strip -->
    <div class="concept-box" id="conceptBox"></div>

    <!-- Groups displayed visually -->
    <div class="groups-area" id="groupsArea"></div>

    <!-- How many total hint -->
    <div class="count-row" id="countRow"></div>

    <!-- Count-it button (animates counting) -->
    <button class="count-btn" id="countBtn" onclick="animateCount()">🔢 Count Them!</button>

    <!-- Answer choices -->
    <div class="answers" id="answers"></div>

    <div class="feedback" id="feedback"></div>
    <button class="next-btn hidden" id="nextBtn" onclick="nextQuestion()">Next ➡️</button>
  </div>
</div>

<!-- Celebration -->
<div class="celebrate hidden" id="celebrateScreen">
  <div class="big-emoji" id="celebEmoji">🎉</div>
  <h2 id="celebTitle">Amazing!</h2>
  <p>You got <b id="finalScore">0</b> out of 8 stars! ⭐</p>
  <button class="play-again-btn" onclick="startGame()">Play Again 🔄</button>
</div>

<!-- Floating count bubble -->
<div id="floatBubble">1</div>

<div class="grass-strip"></div>
<div class="flowers">🌸 🌻 🌼 🌸 🌺 🌼 🌸</div>

<script>
// ── Emoji sets per question ──
const EMOJI_SETS = [
  '🍎', '🐶', '⭐', '🚗', '🎈',
  '🦋', '🍭', '🐟'
];

const TOTAL = 8;
let questions = [], currentQ = 0, score = 0, answered = false, counting = false;

// Keep numbers small & visual for 4.5yr olds: groups 2-3, items 2-4
function generateQuestions() {
  questions = [];
  const configs = [
    {groups:2, each:2}, {groups:2, each:3}, {groups:3, each:2},
    {groups:2, each:4}, {groups:3, each:3}, {groups:4, each:2},
    {groups:2, each:5}, {groups:3, each:2}
  ];
  // shuffle configs
  configs.sort(() => Math.random() - 0.5);
  for (let i = 0; i < TOTAL; i++) {
    const c = configs[i % configs.length];
    questions.push({ groups: c.groups, each: c.each, emoji: EMOJI_SETS[i % EMOJI_SETS.length] });
  }
}

function buildDots() {
  const el = document.getElementById('dots');
  el.innerHTML = '';
  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < currentQ ? ' done' : i === currentQ ? ' current' : '');
    el.appendChild(d);
  }
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getWrongAnswers(correct, groups, each) {
  const s = new Set();
  const attempts = [correct+1, correct-1, correct+2, correct-2, groups*(each+1), groups*(each-1)];
  for (const w of attempts) {
    if (w !== correct && w > 0 && w <= 20) s.add(w);
    if (s.size >= 3) break;
  }
  // fallback
  while (s.size < 3) {
    const w = correct + (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random()*3)+1);
    if (w !== correct && w > 0) s.add(w);
  }
  return [...s].slice(0,3);
}

function renderQuestion() {
  answered = false;
  counting = false;
  const q = questions[currentQ];
  const correct = q.groups * q.each;

  document.getElementById('qnum').textContent = currentQ + 1;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').classList.add('hidden');
  document.getElementById('answers').innerHTML = '';
  document.getElementById('countBtn').classList.remove('hidden');
  // Reset floating bubble
  const bubble = document.getElementById('floatBubble');
  bubble.classList.remove('show', 'pop');
  buildDots();

  // Concept box — avoid × symbol for young kids, use "groups of"
  document.getElementById('conceptBox').innerHTML =
    `<p>We have <span class="num">${q.groups}</span> groups, <br>each group has <span class="num">${q.each}</span> <span style="font-size:1.4em">${q.emoji}</span> <br><span style="font-size:0.9rem;color:#999">How many altogether?</span></p>`;

  // Build group plates
  const area = document.getElementById('groupsArea');
  area.innerHTML = '';
  for (let g = 0; g < q.groups; g++) {
    const plate = document.createElement('div');
    plate.className = 'group-plate';
    plate.style.animationDelay = (g * 0.12) + 's';

    const badge = document.createElement('div');
    badge.className = 'plate-badge';
    badge.textContent = `Group ${g + 1}`;
    plate.appendChild(badge);

    for (let e = 0; e < q.each; e++) {
      const obj = document.createElement('span');
      obj.className = 'obj';
      obj.textContent = q.emoji;
      obj.style.animationDelay = (g * 0.12 + e * 0.07) + 's';
      plate.appendChild(obj);
    }
    area.appendChild(plate);
  }

  // Count row
  document.getElementById('countRow').innerHTML =
    `<b>${q.groups}</b> groups × <b>${q.each}</b> in each = ? 🤔`;

  // Answer buttons — shown after count animation OR immediately
  showAnswerButtons(q);
}

function showAnswerButtons(q) {
  const correct = q.groups * q.each;
  const options = shuffle([correct, ...getWrongAnswers(correct, q.groups, q.each)]);
  const div = document.getElementById('answers');
  div.innerHTML = '';
  options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'ans-btn';
    b.textContent = opt;
    b.onclick = () => checkAnswer(opt, correct, b);
    div.appendChild(b);
  });
}

// ── Animate counting — smooth floating bubble hops over each object ──
function animateCount() {
  if (counting) return;
  counting = true;
  document.getElementById('countBtn').classList.add('hidden');

  const allObjs = [...document.querySelectorAll('#groupsArea .obj')];
  const bubble  = document.getElementById('floatBubble');
  const countRow = document.getElementById('countRow');
  const STEP_MS  = 520; // ms per object

  // Position bubble above a given element using its page coords
  function moveBubbleTo(el) {
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width  / 2;
    const cy = r.top  + r.height / 2;
    bubble.style.left = cx + 'px';
    bubble.style.top  = cy + 'px';
  }

  // Kick off on first object immediately so bubble appears without delay
  let idx = 0;

  function step() {
    // Mark previous object as counted (greyed)
    if (idx > 0) {
      allObjs[idx - 1].classList.remove('highlight');
      allObjs[idx - 1].classList.add('counted');
    }

    if (idx >= allObjs.length) {
      // All done — hide bubble, show total
      bubble.classList.remove('show', 'pop');
      countRow.innerHTML =
        `🎉 We counted <b style="color:var(--purple);font-size:1.5em;vertical-align:middle"> ${allObjs.length} </b> altogether!`;
      return;
    }

    const obj = allObjs[idx];
    obj.classList.add('highlight');

    // Update bubble number
    bubble.textContent = idx + 1;

    // Move bubble position instantly on first, then CSS transition handles motion
    if (idx === 0) {
      bubble.style.transition = 'none';
      moveBubbleTo(obj);
      // Force reflow so transition re-enables for subsequent moves
      bubble.offsetHeight;
      bubble.style.transition = '';
      bubble.classList.add('show');
    } else {
      moveBubbleTo(obj);
    }

    // Pop animation on bubble each step
    bubble.classList.remove('pop');
    bubble.offsetHeight; // reflow to restart animation
    bubble.classList.add('pop');

    // Update count row text
    countRow.innerHTML =
      `Counting... <b style="color:var(--purple);font-size:1.4em">${idx + 1}</b> 🔢`;

    idx++;
    setTimeout(step, STEP_MS);
  }

  step();
}

function checkAnswer(sel, correct, btn) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('.ans-btn').forEach(b => b.style.pointerEvents = 'none');
  document.getElementById('countBtn').classList.add('hidden');

  if (sel === correct) {
    btn.classList.add('correct');
    score++;
    document.getElementById('score').textContent = score;
    document.getElementById('feedback').textContent = pickYay();
    document.getElementById('feedback').className = 'feedback yay';
    spawnConfetti(7);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.ans-btn').forEach(b => { if (+b.textContent === correct) b.classList.add('correct'); });
    document.getElementById('feedback').textContent = pickOops();
    document.getElementById('feedback').className = 'feedback oops';
  }

  if (currentQ < TOTAL - 1) {
    document.getElementById('nextBtn').classList.remove('hidden');
  } else {
    setTimeout(showCelebration, 1300);
  }
}

function nextQuestion() { currentQ++; renderQuestion(); }

function showCelebration() {
  document.getElementById('celebrateScreen').classList.remove('hidden');
  document.getElementById('finalScore').textContent = score;
  const emoji = score >= 7 ? '🏆' : score >= 5 ? '🎉' : '💪';
  const title = score >= 7 ? "Multiplication Master! 🌟" : score >= 5 ? "Great Counting!" : "Keep Practicing!";
  document.getElementById('celebEmoji').textContent = emoji;
  document.getElementById('celebTitle').textContent = title;
  spawnConfetti(40);
}

function startGame() {
  currentQ = 0; score = 0;
  document.getElementById('score').textContent = 0;
  document.getElementById('celebrateScreen').classList.add('hidden');
  generateQuestions();
  renderQuestion();
}

function pickYay() {
  return ['🎉 Yes! So smart!','⭐ You got it!','🌟 Amazing job!','🏆 Brilliant!','🥳 Superstar!','💫 Wow wow wow!'][Math.floor(Math.random()*6)];
}
function pickOops() {
  return ['😊 Good try! Next!','💪 Almost!','🌈 Keep going!','🤗 You can do it!'][Math.floor(Math.random()*4)];
}

function spawnConfetti(n) {
  const colors = ['#FFD93D','#FF7043','#FF6B9D','#4CAF50','#42A5F5','#AB47BC','#26C6DA'];
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      c.style.cssText = `left:${Math.random()*100}vw;top:-10px;background:${colors[Math.floor(Math.random()*colors.length)]};animation-duration:${1.5+Math.random()}s;animation-delay:${Math.random()*0.4}s;width:${8+Math.random()*9}px;height:${8+Math.random()*9}px;`;
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3200);
    }, i * 55);
  }
}

startGame();
</script>
