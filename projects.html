<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samanyu's Projects!</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky:    #B8EEFF;
    --sun:    #FFD93D;
    --grass:  #6BCB77;
    --coral:  #FF6B6B;
    --purple: #C77DFF;
    --orange: #FFA552;
    --teal:   #3DD9C5;
    --pink:   #FF85C2;
    --navy:   #1A1A4E;
  }

  html, body {
    width: 100%; height: 100vh;
    background: var(--sky);
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
  }

  /* ── BACKGROUND ── */
  .sky-bg {
    position: fixed; inset: 0;
    background: linear-gradient(180deg, #B8EEFF 0%, #D8F4FF 60%, #C5EDDB 100%);
    z-index: 0;
  }

  .sun {
    position: fixed;
    top: 30px; right: 60px;
    width: 80px; height: 80px;
    background: var(--sun);
    border-radius: 50%;
    z-index: 1;
    box-shadow: 0 0 0 14px rgba(255,217,61,0.2), 0 0 0 28px rgba(255,217,61,0.08);
    animation: pulse-sun 3s ease-in-out infinite;
  }
  @keyframes pulse-sun {
    0%,100% { box-shadow: 0 0 0 14px rgba(255,217,61,0.2), 0 0 0 28px rgba(255,217,61,0.08); }
    50%      { box-shadow: 0 0 0 20px rgba(255,217,61,0.25), 0 0 0 40px rgba(255,217,61,0.1); }
  }

  .cloud {
    position: fixed;
    background: white;
    border-radius: 100px;
    opacity: 0.85;
    z-index: 1;
    animation: float-cloud linear infinite;
  }
  .cloud::before, .cloud::after {
    content: ''; position: absolute;
    background: white; border-radius: 50%;
  }
  .c1 { width:120px; height:40px; top:80px; left:-140px; animation-duration:28s; }
  .c1::before { width:60px; height:60px; top:-30px; left:15px; }
  .c1::after  { width:45px; height:45px; top:-20px; left:55px; }
  .c2 { width:90px; height:30px; top:150px; left:-110px; animation-duration:42s; animation-delay:-18s; opacity:0.6; }
  .c2::before { width:45px; height:45px; top:-25px; left:10px; }
  .c2::after  { width:35px; height:35px; top:-18px; left:40px; }
  @keyframes float-cloud {
    from { transform: translateX(0); }
    to   { transform: translateX(110vw); }
  }

  .grass {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 90px; background: var(--grass); z-index: 1;
    border-radius: 60% 60% 0 0 / 30px 30px 0 0;
  }
  .grass::before {
    content: ''; position: absolute;
    top: -18px; left: 0; right: 0; height: 36px;
    background: #82D989;
    border-radius: 60% 60% 0 0 / 100%;
  }

  /* ── LAYOUT ── */
  .page {
    position: relative; z-index: 2;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 32px 100px;
    gap: 24px;
  }

  /* ── BACK BUTTON ── */
  .back-btn {
    position: fixed;
    top: 24px; left: 28px;
    z-index: 10;
    background: white;
    border: 3px solid var(--navy);
    box-shadow: 4px 4px 0 var(--navy);
    border-radius: 50px;
    padding: 10px 22px;
    font-family: 'Fredoka One', cursive;
    font-size: 16px;
    color: var(--navy);
    text-decoration: none;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    animation: pop-in 0.5s cubic-bezier(.34,1.56,.64,1) both;
  }
  .back-btn:hover {
    transform: translateY(-3px);
    box-shadow: 6px 7px 0 var(--navy);
  }
  .back-btn:active {
    transform: translateY(1px);
    box-shadow: 2px 2px 0 var(--navy);
  }
  .back-btn .arrow { font-size: 20px; }

  /* ── BANNER ── */
  .banner {
    background: white;
    border-radius: 28px;
    padding: 18px 40px;
    text-align: center;
    border: 4px solid var(--navy);
    box-shadow: 6px 6px 0 var(--navy);
    animation: pop-in 0.6s cubic-bezier(.34,1.56,.64,1) 0.05s both;
    width: 100%; max-width: 680px;
  }
  .banner h1 {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(28px, 5vw, 52px);
    color: var(--purple);
    line-height: 1;
  }
  .banner h1 span { color: var(--coral); }
  .banner p {
    font-size: clamp(13px, 1.8vw, 16px);
    color: #777; margin-top: 5px; font-weight: 600;
  }

  /* ── PROJECT CARDS GRID ── */
  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 18px;
    width: 100%; max-width: 820px;
    animation: pop-in 0.6s cubic-bezier(.34,1.56,.64,1) 0.2s both;
  }

  /* ── INDIVIDUAL PROJECT CARD ── */
  .proj-card {
    background: white;
    border-radius: 26px;
    padding: 26px 16px 20px;
    text-align: center;
    border: 4px solid var(--navy);
    box-shadow: 5px 5px 0 var(--navy);
    cursor: pointer;
    text-decoration: none;
    display: flex; flex-direction: column;
    align-items: center; gap: 10px;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s ease;
    position: relative; overflow: hidden;
  }
  .proj-card:hover {
    transform: translateY(-8px) rotate(-1.5deg);
    box-shadow: 8px 12px 0 var(--navy);
  }
  .proj-card:active {
    transform: translateY(2px);
    box-shadow: 3px 3px 0 var(--navy);
  }

  .proj-icon {
    font-size: 46px; line-height: 1;
    animation: bounce-icon 2s ease-in-out infinite;
  }
  .proj-card:nth-child(2) .proj-icon { animation-delay: -0.5s; }
  .proj-card:nth-child(3) .proj-icon { animation-delay: -1s; }
  .proj-card:nth-child(4) .proj-icon { animation-delay: -1.5s; }

  @keyframes bounce-icon {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }

  .proj-title {
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    color: var(--navy);
    line-height: 1.2;
  }

  .proj-desc {
    font-size: 12px; color: #999;
    font-weight: 600; line-height: 1.4;
  }

  .proj-tag {
    font-size: 11px; font-weight: 800;
    padding: 5px 14px; border-radius: 100px;
    color: white; letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .proj-blob {
    position: absolute;
    bottom: -24px; right: -24px;
    width: 80px; height: 80px;
    border-radius: 50%; opacity: 0.1;
  }

  /* Card color themes */
  .card-interior .proj-tag  { background: var(--orange); }
  .card-interior .proj-blob { background: var(--orange); }

  .card-3d      .proj-tag  { background: var(--teal); }
  .card-3d      .proj-blob { background: var(--teal); }

  .card-coming1 .proj-tag  { background: #ccc; }
  .card-coming1 .proj-blob { background: #ccc; }
  .card-coming1            { opacity: 0.65; cursor: default; }
  .card-coming1:hover      { transform: none; box-shadow: 5px 5px 0 var(--navy); }

  .card-coming2 .proj-tag  { background: #ccc; }
  .card-coming2 .proj-blob { background: #ccc; }
  .card-coming2            { opacity: 0.65; cursor: default; }
  .card-coming2:hover      { transform: none; box-shadow: 5px 5px 0 var(--navy); }

  /* ── FOOTER STRIP ── */
  .footer-strip {
    position: fixed; bottom: 8px; left: 0; right: 0;
    height: 52px; z-index: 3;
    display: flex; align-items: center; justify-content: center; gap: 24px;
  }
  .footer-strip span {
    font-size: 24px;
    animation: bounce-icon 1.8s ease-in-out infinite;
  }
  .footer-strip span:nth-child(2) { animation-delay: -0.6s; }
  .footer-strip span:nth-child(3) { animation-delay: -1.2s; }

  /* ── POP-IN ── */
  @keyframes pop-in {
    from { opacity: 0; transform: scale(0.8) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .page { padding: 70px 16px 100px; gap: 16px; }
    .projects-grid { grid-template-columns: 1fr 1fr; }
    .banner { padding: 16px 24px; }
    .sun { width: 50px; height: 50px; top: 12px; right: 16px; }
  }
</style>
</head>
<body>

<div class="sky-bg"></div>
<div class="sun"></div>
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="grass"></div>

<!-- BACK BUTTON -->
<a class="back-btn" href="index.html">
  <span class="arrow">←</span> Back Home
</a>

<div class="page">

  <!-- BANNER -->
  <div class="banner">
    <h1>🚀 My <span>Projects!</span></h1>
    <p>Pick a project and let's explore together ✨</p>
  </div>

  <!-- PROJECT CARDS -->
  <div class="projects-grid">

    <!-- Interior Design Maths -->
    <a class="proj-card card-interior" href="interior-design-maths.html">
      <div class="proj-icon">📐</div>
      <div class="proj-title">Interior Design Maths</div>
      <div class="proj-desc">Shapes, spaces & numbers!</div>
      <div class="proj-tag">Explore</div>
      <div class="proj-blob"></div>
    </a>

    <!-- 3D Layouts -->
    <a class="proj-card card-3d" href="3d-layouts.html">
      <div class="proj-icon">🧊</div>
      <div class="proj-title">3D Layouts</div>
      <div class="proj-desc">Build rooms in 3 dimensions!</div>
      <div class="proj-tag">Explore</div>
      <div class="proj-blob"></div>
    </a>

    <!-- Coming Soon placeholders -->
    <div class="proj-card card-coming1">
      <div class="proj-icon">🎮</div>
      <div class="proj-title">Coming Soon</div>
      <div class="proj-desc">Something fun is brewing...</div>
      <div class="proj-tag">Soon</div>
      <div class="proj-blob"></div>
    </div>

    <div class="proj-card card-coming2">
      <div class="proj-icon">🎨</div>
      <div class="proj-title">Coming Soon</div>
      <div class="proj-desc">More cool stuff ahead!</div>
      <div class="proj-tag">Soon</div>
      <div class="proj-blob"></div>
    </div>

  </div>

</div>

<div class="footer-strip">
  <span>🌸</span><span>🌻</span><span>🌺</span>
</div>

</body>
</html>
