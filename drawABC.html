<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlphaDraw — Capital Letters</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f0e8;
      --surface: #fffdf8;
      --surface2: #fff9f0;
      --accent: #185FA5;
      --accent2: #0F6E56;
      --accent3: #993C1D;
      --text: #2a2420;
      --text-muted: #7a6e65;
      --border: rgba(42,36,32,0.12);
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --radius: 14px;
      --radius-sm: 9px;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1.5px solid var(--border);
      padding: 1.5rem 2rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      color: var(--accent);
      letter-spacing: -0.5px;
    }

    .logo span { color: var(--accent3); }

    header p {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; }
      header { flex-direction: column; align-items: flex-start; gap: 4px; }
    }

    .grid-section h2 {
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      text-transform: uppercase;
    }

    .letter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      gap: 10px;
    }

    .letter-card {
      aspect-ratio: 1;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka One', cursive;
      font-size: 1.6rem;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: var(--shadow);
    }

    .letter-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .letter-card.active {
      background: var(--accent);
      color: #fff;
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(24,95,165,0.35);
    }

    .demo-panel {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem 1.25rem;
      position: sticky;
      top: 1.5rem;
    }

    .demo-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .demo-letter-badge { font-family: 'Fredoka One', cursive; font-size: 2.2rem; color: var(--accent); }
    .demo-title { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }

    .replay-btn {
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--accent);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      display: none;
    }

    .replay-btn:hover { background: var(--accent); color: #fff; }

    canvas#letter-canvas {
      display: block;
      width: 100%;
      border-radius: var(--radius-sm);
      background: var(--surface2);
      border: 1px solid var(--border);
    }

    .stroke-dots { display: flex; gap: 7px; justify-content: center; margin-top: 14px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); border: 1.5px solid transparent; }
    .dot.done { background: var(--accent); }
    .dot.current { background: #fff; border-color: var(--accent); }

    .stroke-info { margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--text-muted); text-align: center; min-height: 20px; }
    .stroke-info.complete { color: var(--accent2); }

    .hint { text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-size: 14px; font-weight: 600; }
    .hint-icon { font-size: 3rem; display: block; }

    footer { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 13px; border-top: 1px solid var(--border); margin-top: 2rem; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">Alpha<span>Draw</span></div>
    <p>Watch how every capital letter is drawn stroke by stroke</p>
  </div>
</header>

<main>
  <section class="grid-section">
    <h2>Choose a letter</h2>
    <div class="letter-grid" id="grid"></div>
  </section>

  <aside class="demo-panel" id="demo-panel">
    <div class="demo-header">
      <div>
        <div class="demo-title" id="demo-title">Pick a letter</div>
        <div class="demo-letter-badge" id="demo-badge">—</div>
      </div>
      <button class="replay-btn" id="replay-btn">↺ Replay</button>
    </div>
    <div id="canvas-container">
      <div class="hint">
        <span class="hint-icon">✏️</span>
        Select a letter to see the drawing sequence.
      </div>
    </div>
    <div class="stroke-dots" id="dots"></div>
    <div class="stroke-info" id="stroke-info"></div>
  </aside>
</main>

<footer>AlphaDraw — Educational Letter Tracing</footer>

<script>
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const W = 280, H = 280, CX = 140, CY = 140, S = 85;

function pt(x, y) { return [CX + x * S / 100, CY + y * S / 100]; }

function arc(cxPx, cyPx, rx, ry, startDeg, endDeg, steps = 45) {
  const pts = [];
  const s = startDeg * Math.PI / 180;
  const e = endDeg * Math.PI / 180;
  for (let i = 0; i <= steps; i++) {
    const a = s + (e - s) * (i / steps);
    pts.push([cxPx + Math.cos(a) * rx, cyPx + Math.sin(a) * ry]);
  }
  return pts;
}

const DEFS = {
  A: { strokes: [
    { path: [pt(-58, 82), pt(0, -82)], label: 'Left diagonal' },
    { path: [pt(0, -82), pt(58, 82)], label: 'Right diagonal' },
    { path: [pt(-28, 12), pt(28, 12)], label: 'Crossbar' }
  ]},
  B: { strokes: [
    { path: [pt(-42, -82), pt(-42, 82)], label: 'Vertical stem' },
    { path: arc(CX - 42 * S / 100, CY - 41 * S / 100, 46 * S / 100, 40 * S / 100, -90, 90), label: 'Top curve' },
    { path: arc(CX - 42 * S / 100, CY + 41 * S / 100, 52 * S / 100, 41 * S / 100, -90, 90), label: 'Bottom curve' }
  ]},
  C: { strokes: [
    { path: arc(CX, CY, 72 * S / 100, 78 * S / 100, -60, -300), label: 'Large curve' }
  ]},
  D: { strokes: [
    { path: [pt(-42, -82), pt(-42, 82)], label: 'Vertical stem' },
    { path: arc(CX - 42 * S / 100, CY, 82 * S / 100, 82 * S / 100, -90, 90), label: 'Big curve' }
  ]},
  E: { strokes: [
    { path: [pt(-52, -82), pt(-52, 82)], label: 'Vertical stem' },
    { path: [pt(-52, -82), pt(52, -82)], label: 'Top bar' },
    { path: [pt(-52, 0), pt(28, 0)], label: 'Middle bar' },
    { path: [pt(-52, 82), pt(52, 82)], label: 'Bottom bar' }
  ]},
  F: { strokes: [
    { path: [pt(-52, -82), pt(-52, 82)], label: 'Vertical stem' },
    { path: [pt(-52, -82), pt(52, -82)], label: 'Top bar' },
    { path: [pt(-52, 0), pt(28, 0)], label: 'Middle bar' }
  ]},
  G: { strokes: [
    { path: arc(CX, CY, 72 * S / 100, 80 * S / 100, -60, -360), label: 'Main curve' },
    { path: [pt(72, 0), pt(22, 0)], label: 'Horizontal crossbar' },
    { path: [pt(72, 0), pt(72, 82)], label: 'Vertical stem' }
  ]},
  H: { strokes: [
    { path: [pt(-52, -82), pt(-52, 82)], label: 'Left stem' },
    { path: [pt(52, -82), pt(52, 82)], label: 'Right stem' },
    { path: [pt(-52, 0), pt(52, 0)], label: 'Crossbar' }
  ]},
  I: { strokes: [
    { path: [pt(-32, -82), pt(32, -82)], label: 'Top bar' },
    { path: [pt(0, -82), pt(0, 82)], label: 'Center stem' },
    { path: [pt(-32, 82), pt(32, 82)], label: 'Bottom bar' }
  ]},
  J: { strokes: [
    { path: [pt(20, -82), pt(20, 42)], label: 'Stem' },
    { path: arc(CX - 20 * S / 100, CY + 42 * S / 100, 40 * S / 100, 40 * S / 100, 0, 180), label: 'Hook' }
  ]},
  K: { strokes: [
    { path: [pt(-52, -82), pt(-52, 82)], label: 'Vertical stem' },
    { path: [pt(55, -82), pt(-14, -28)], label: 'Upper arm' },
    { path: [pt(-14, -28), pt(55, 82)], label: 'Lower leg' }
  ]},
  L: { strokes: [
    { path: [pt(-52, -82), pt(-52, 82)], label: 'Vertical stem' },
    { path: [pt(-52, 82), pt(52, 82)], label: 'Base' }
  ]},
  M: { strokes: [
    { path: [pt(-62, -82), pt(-62, 82)], label: 'Left stem' },
    { path: [pt(-62, -82), pt(0, 10)], label: 'Left diagonal' },
    { path: [pt(0, 10), pt(62, -82)], label: 'Right diagonal' },
    { path: [pt(62, -82), pt(62, 82)], label: 'Right stem' }
  ]},
  N: { strokes: [
    { path: [pt(-52, -82), pt(-52, 82)], label: 'Left stem' },
    { path: [pt(-52, -82), pt(52, 82)], label: 'Diagonal' },
    { path: [pt(52, -82), pt(52, 82)], label: 'Right stem' }
  ]},
  O: { strokes: [
    { path: arc(CX, CY, 72 * S / 100, 80 * S / 100, -90, 270, 60), label: 'Full oval' }
  ]},
  P: { strokes: [
    { path: [pt(-42, -82), pt(-42, 82)], label: 'Vertical stem' },
    { path: arc(CX - 42 * S / 100, CY - 40 * S / 100, 55 * S / 100, 42 * S / 100, -90, 90), label: 'Loop' }
  ]},
  Q: { strokes: [
    { path: arc(CX, CY, 72 * S / 100, 80 * S / 100, -90, 270, 60), label: 'Outer oval' },
    { path: [pt(25, 30), pt(65, 75)], label: 'Tail' }
  ]},
  R: { strokes: [
    { path: [pt(-42, -82), pt(-42, 82)], label: 'Vertical stem' },
    { path: arc(CX - 42 * S / 100, CY - 40 * S / 100, 55 * S / 100, 42 * S / 100, -90, 90), label: 'Top loop' },
    { path: [pt(-42, 2), pt(58, 82)], label: 'Diagonal leg' }
  ]},
  S: { strokes: [
    { path: [
        // Fresh S logic: Start top-right, arc around upper bowl, transition through spine, arc around lower bowl
        ...arc(CX + 12*S/100, CY - 42*S/100, 45*S/100, 40*S/100, -20, 190, 40),
        ...arc(CX - 12*S/100, CY + 42*S/100, 45*S/100, 40*S/100, 10, -200, 40)
      ], label: 'Continuous S-curve' }
  ]},
  T: { strokes: [
    { path: [pt(-62, -82), pt(62, -82)], label: 'Top bar' },
    { path: [pt(0, -82), pt(0, 82)], label: 'Stem' }
  ]},
  U: { strokes: [
    { path: [
        pt(-52, -82),
        pt(-52, 35),
        ...arc(CX, CY + 35*S/100, 52*S/100, 47*S/100, 180, 0),
        pt(52, 35),
        pt(52, -82)
      ], label: 'U-shape' }
  ]},
  V: { strokes: [
    { path: [pt(-62, -82), pt(0, 82)], label: 'Left diagonal' },
    { path: [pt(0, 82), pt(62, -82)], label: 'Right diagonal' }
  ]},
  W: { strokes: [
    { path: [pt(-72, -82), pt(-38, 82)], label: 'Down-stroke 1' },
    { path: [pt(-38, 82), pt(0, -18)], label: 'Up-stroke 2' },
    { path: [pt(0, -18), pt(38, 82)], label: 'Down-stroke 3' },
    { path: [pt(38, 82), pt(72, -82)], label: 'Up-stroke 4' }
  ]},
  X: { strokes: [
    { path: [pt(-60, -82), pt(60, 82)], label: 'Diagonal 1' },
    { path: [pt(60, -82), pt(-60, 82)], label: 'Diagonal 2' }
  ]},
  Y: { strokes: [
    { path: [pt(-60, -82), pt(0, 0)], label: 'Left arm' },
    { path: [pt(60, -82), pt(0, 0)], label: 'Right arm' },
    { path: [pt(0, 0), pt(0, 82)], label: 'Base stem' }
  ]},
  Z: { strokes: [
    { path: [pt(-58, -82), pt(58, -82)], label: 'Top bar' },
    { path: [pt(58, -82), pt(-58, 82)], label: 'Diagonal' },
    { path: [pt(-58, 82), pt(58, 82)], label: 'Bottom bar' }
  ]}
};

const COLORS = ['#185FA5', '#0F6E56', '#993C1D', '#534AB7', '#3B6D11'];
let animId = null, currentLetter = null, canvas = null, ctx = null;

function initCanvas() {
  const container = document.getElementById('canvas-container');
  container.innerHTML = '';
  canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  container.appendChild(canvas);
  ctx = canvas.getContext('2d');
}

function drawBackground() {
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(0,0,0,0.07)';
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(0, H/2); ctx.lineTo(W, H/2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
  ctx.setLineDash([]);
}

function drawGhost(letter) {
  const def = DEFS[letter];
  ctx.globalAlpha = 0.05;
  ctx.strokeStyle = '#185FA5';
  ctx.lineWidth = 16;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  def.strokes.forEach(s => {
    ctx.beginPath();
    s.path.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

function drawArrow([x, y], [px, py], color) {
  if (!px) return;
  const angle = Math.atan2(y - py, x - px);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x + 10 * Math.cos(angle), y + 10 * Math.sin(angle));
  ctx.lineTo(x + 10 * Math.cos(angle + 2.4), y + 10 * Math.sin(angle + 2.4));
  ctx.lineTo(x + 10 * Math.cos(angle - 2.4), y + 10 * Math.sin(angle - 2.4));
  ctx.fill();
}

function drawCompletedStrokes(letter, upTo) {
  const def = DEFS[letter];
  for (let i = 0; i < upTo; i++) {
    const s = def.strokes[i];
    const color = COLORS[i % COLORS.length];
    ctx.strokeStyle = color;
    ctx.lineWidth = 13;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    s.path.forEach(([x, y], j) => j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
    ctx.stroke();
    drawArrow(s.path[s.path.length-1], s.path[s.path.length-2], color);
  }
}

function animateLetter(letter) {
  if (animId) cancelAnimationFrame(animId);
  const def = DEFS[letter];
  const strokes = def.strokes;
  const dotsEl = document.getElementById('dots');
  dotsEl.innerHTML = strokes.map((_, i) => `<div class="dot" id="dot-${i}"></div>`).join('');
  
  let si = 0;

  function runStroke() {
    if (si >= strokes.length) {
      const info = document.getElementById('stroke-info');
      info.textContent = '✓ Complete!';
      info.className = 'stroke-info complete';
      document.getElementById('replay-btn').style.display = '';
      return;
    }

    const stroke = strokes[si];
    const path = stroke.path;
    const color = COLORS[si % COLORS.length];
    
    let totalLen = 0;
    const dists = [];
    for (let i = 0; i < path.length - 1; i++) {
      const d = Math.hypot(path[i+1][0] - path[i][0], path[i+1][1] - path[i][1]);
      totalLen += d;
      dists.push(d);
    }

    const TARGET_MS = 850;
    let startTime = null;

    function frame(timestamp) {
      if (!startTime) startTime = timestamp;
      const progress = Math.min((timestamp - startTime) / TARGET_MS, 1);

      drawBackground();
      drawGhost(letter);
      drawCompletedStrokes(letter, si);

      ctx.strokeStyle = color;
      ctx.lineWidth = 13;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(path[0][0], path[0][1]);

      let currentDist = progress * totalLen;
      let acc = 0;
      let curX = path[0][0], curY = path[0][1];

      for (let i = 0; i < path.length - 1; i++) {
        if (acc + dists[i] < currentDist) {
          ctx.lineTo(path[i+1][0], path[i+1][1]);
          acc += dists[i];
          curX = path[i+1][0]; curY = path[i+1][1];
        } else {
          const ratio = dists[i] > 0 ? (currentDist - acc) / dists[i] : 1;
          curX = path[i][0] + (path[i+1][0] - path[i][0]) * ratio;
          curY = path[i][1] + (path[i+1][1] - path[i][1]) * ratio;
          ctx.lineTo(curX, curY);
          break;
        }
      }
      ctx.stroke();

      if (progress < 1) {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(curX, curY, 8, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(curX, curY, 8, 0, Math.PI * 2); ctx.stroke();
        animId = requestAnimationFrame(frame);
      } else {
        drawArrow(path[path.length-1], path[path.length-2], color);
        si++;
        setTimeout(runStroke, 300);
      }
    }
    document.getElementById('stroke-info').textContent = `Stroke ${si+1}: ${stroke.label}`;
    document.querySelectorAll('.dot').forEach((d, i) => d.className = 'dot' + (i < si ? ' done' : i === si ? ' current' : ''));
    animId = requestAnimationFrame(frame);
  }
  runStroke();
}

const grid = document.getElementById('grid');
LETTERS.forEach(l => {
  const card = document.createElement('div');
  card.className = 'letter-card';
  card.textContent = l;
  card.addEventListener('click', () => {
    document.querySelectorAll('.letter-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    currentLetter = l;
    document.getElementById('demo-title').textContent = 'Drawing letter';
    document.getElementById('demo-badge').textContent = l;
    initCanvas();
    animateLetter(l);
  });
  grid.appendChild(card);
});

document.getElementById('replay-btn').addEventListener('click', () => {
  if (currentLetter) {
    document.getElementById('replay-btn').style.display = 'none';
    initCanvas();
    animateLetter(currentLetter);
  }
});
</script>
</body>
</html>
