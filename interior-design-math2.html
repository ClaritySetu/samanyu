<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interior Budget Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:    #1C2B3A;
  --navy2:   #243447;
  --accent:  #C9974A;
  --accent2: #E8B876;
  --ivory:   #F7F3EE;
  --ivory2:  #EDE8E0;
  --text:    #2C2C2C;
  --muted:   #7A7A7A;
  --border:  #DDD8D0;
  --green:   #2E7D5E;
  --green2:  #EAF5F0;
  --red:     #C0392B;
  --red2:    #FDF0EF;
  --white:   #FFFFFF;
  --shadow:  0 2px 12px rgba(28,43,58,0.10);
  --shadow-lg: 0 8px 32px rgba(28,43,58,0.16);
}

html, body {
  height: 100%;
  font-family: 'DM Sans', sans-serif;
  background: var(--ivory);
  color: var(--text);
}

/* ── LAYOUT ── */
.shell {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: 100vh;
}

/* ── SIDEBAR ── */
.sidebar {
  background: var(--navy);
  color: white;
  display: flex;
  flex-direction: column;
  padding: 36px 24px 28px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow: hidden;
}

.sidebar-logo {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: var(--accent2);
  letter-spacing: 0.01em;
  margin-bottom: 6px;
}

.sidebar-sub {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 40px;
}

.sidebar-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  margin-bottom: 12px;
}

/* Summary boxes in sidebar */
.stat-card {
  background: var(--navy2);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 12px;
  border: 1px solid rgba(255,255,255,0.06);
  transition: transform 0.2s ease;
}
.stat-card:hover { transform: translateX(3px); }

.stat-label {
  font-size: 11px;
  font-weight: 500;
  color: rgba(255,255,255,0.45);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 6px;
}

.stat-value {
  font-family: 'DM Serif Display', serif;
  font-size: 26px;
  color: white;
  line-height: 1;
}

.stat-value.accent { color: var(--accent2); }
.stat-unit { font-size: 12px; font-family: 'DM Sans', sans-serif; color: rgba(255,255,255,0.45); margin-left: 4px; }

.sidebar-divider {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.08);
  margin: 24px 0;
}

.item-count {
  font-size: 13px;
  color: rgba(255,255,255,0.5);
  margin-bottom: auto;
}
.item-count span { color: var(--accent2); font-weight: 600; }

.btn-add {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--accent);
  color: white;
  border: none;
  padding: 13px 20px;
  border-radius: 10px;
  cursor: pointer;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  margin-top: 24px;
  transition: background 0.2s, transform 0.15s;
  width: 100%;
  letter-spacing: 0.02em;
}
.btn-add:hover { background: var(--accent2); transform: translateY(-2px); }
.btn-add:active { transform: translateY(0); }
.btn-add .plus { font-size: 20px; line-height: 1; }

/* ── MAIN CONTENT ── */
.main {
  padding: 36px 40px 60px;
  max-width: 860px;
}

.page-title {
  font-family: 'DM Serif Display', serif;
  font-size: 32px;
  color: var(--navy);
  margin-bottom: 4px;
}

.page-hint {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 32px;
  font-weight: 400;
}

/* ── ITEM CARD ── */
.card {
  background: var(--white);
  border-radius: 16px;
  padding: 0;
  margin-bottom: 16px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: box-shadow 0.2s ease, opacity 0.2s ease;
  animation: slide-in 0.3s cubic-bezier(.34,1.56,.64,1) both;
}
.card:hover { box-shadow: var(--shadow-lg); }
.card.excluded { opacity: 0.45; }

@keyframes slide-in {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Card top bar */
.card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--ivory2);
  background: var(--ivory);
}

/* Custom checkbox */
.check-wrap {
  position: relative;
  width: 20px; height: 20px;
  flex-shrink: 0;
}
.check-wrap input[type="checkbox"] {
  position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; margin: 0;
}
.check-box {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-radius: 6px;
  background: white;
  display: flex; align-items: center; justify-content: center;
  transition: border-color 0.15s, background 0.15s;
  pointer-events: none;
}
.check-wrap input:checked ~ .check-box {
  background: var(--green);
  border-color: var(--green);
}
.check-wrap input:checked ~ .check-box::after {
  content: '';
  width: 5px; height: 9px;
  border: 2px solid white;
  border-top: none; border-left: none;
  transform: rotate(42deg) translateY(-1px);
  display: block;
}

.item-number {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  background: var(--ivory2);
  border-radius: 6px;
  padding: 3px 8px;
  letter-spacing: 0.05em;
  flex-shrink: 0;
}

.component-name {
  font-family: 'DM Sans', sans-serif;
  font-weight: 600;
  font-size: 15px;
  border: none;
  background: transparent;
  outline: none;
  flex-grow: 1;
  color: var(--text);
  padding: 2px 4px;
  border-radius: 4px;
  transition: background 0.15s;
}
.component-name:hover { background: var(--ivory2); }
.component-name:focus { background: var(--ivory2); }

.btn-delete {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 7px;
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 16px;
  flex-shrink: 0;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  line-height: 1;
}
.btn-delete:hover { background: var(--red2); color: var(--red); border-color: var(--red); }

/* Card body */
.card-body { padding: 20px; }

/* Dimension inputs */
.input-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}

.dim-group { display: flex; flex-direction: column; gap: 6px; }

.section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

.unit-inputs { display: flex; gap: 8px; }

.input-box { display: flex; flex-direction: column; flex: 1; gap: 3px; }

.unit-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}

input[type="number"] {
  width: 100%;
  padding: 9px 11px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  color: var(--text);
  background: var(--ivory);
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  appearance: textfield;
  -moz-appearance: textfield;
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
input[type="number"]:hover { border-color: #B8B2AA; }
input[type="number"]:focus { outline: none; border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgba(201,151,74,0.12); }
input[type="number"].input-error { border-color: var(--red); background: var(--red2); }

.field-warning {
  font-size: 10px;
  color: var(--red);
  font-weight: 500;
  display: none;
}
.field-warning.visible { display: block; }

/* Rate + result row */
.rate-section {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding-top: 16px;
  border-top: 1px solid var(--ivory2);
  gap: 16px;
}

.rate-wrap { display: flex; flex-direction: column; gap: 4px; }

.rate-input-row {
  display: flex;
  align-items: center;
  gap: 0;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--ivory);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.rate-input-row:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(201,151,74,0.12);
  background: white;
}

.rate-prefix {
  padding: 9px 10px 9px 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  background: transparent;
  border: none;
  pointer-events: none;
}

.rate-input-row input[type="number"] {
  border: none;
  border-radius: 0;
  background: transparent;
  padding: 9px 11px 9px 2px;
  box-shadow: none;
  width: 120px;
  flex: 1;
}
.rate-input-row input[type="number"]:focus {
  border: none;
  box-shadow: none;
  background: transparent;
}
.rate-input-row input[type="number"]:hover { border: none; }

.rate-suffix {
  padding: 9px 12px 9px 0;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--muted);
  white-space: nowrap;
  text-transform: uppercase;
}

/* Result pill */
.result-summary {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.item-area {
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
  background: var(--ivory2);
  padding: 3px 10px;
  border-radius: 100px;
}

.item-cost {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: var(--green);
  line-height: 1;
}

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.empty-state .empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
  opacity: 0.4;
}
.empty-state p { font-size: 15px; margin-bottom: 6px; color: var(--text); font-weight: 500; }
.empty-state small { font-size: 13px; }

/* ── RESPONSIVE ── */
@media (max-width: 720px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; flex-direction: row; flex-wrap: wrap; gap: 12px; padding: 20px; }
  .sidebar-logo { width: 100%; margin-bottom: 0; }
  .sidebar-sub { width: 100%; margin-bottom: 8px; }
  .stat-card { flex: 1; min-width: 130px; margin-bottom: 0; }
  .btn-add { width: auto; margin-top: 0; }
  .main { padding: 20px 16px 40px; }
  .input-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="shell">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">Interior Planner</div>
    <div class="sidebar-sub">Budget Tracker</div>

    <div class="sidebar-label">Summary</div>

    <div class="stat-card">
      <div class="stat-label">Total Area</div>
      <div class="stat-value">
        <span id="grand-area">0.0000</span>
        <span class="stat-unit">sq.ft</span>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-label">Total Cost</div>
      <div class="stat-value accent">
        ₹<span id="grand-cost">0.00</span>
      </div>
    </div>

    <hr class="sidebar-divider">

    <div class="item-count">
      <span id="item-count">0</span> items tracked
    </div>

    <button class="btn-add" onclick="addComponent()">
      <span class="plus">+</span> Add New Item
    </button>
  </aside>

  <!-- ── MAIN ── -->
  <main class="main">
    <div class="page-title">Room Components</div>
    <div class="page-hint">Enter dimensions in feet &amp; inches — cost is calculated per sq. ft.</div>

    <div id="component-list"></div>
  </main>

</div>

<script>
  let components = JSON.parse(localStorage.getItem('interiorBudgetData')) || [];

  function save() {
    localStorage.setItem('interiorBudgetData', JSON.stringify(components));
  }

  function sanitize(field, value) {
    const num = parseFloat(value) || 0;
    if (field === 'lIn' || field === 'wIn') return Math.min(11, Math.max(0, num));
    return Math.max(0, num);
  }

  function updateValue(id, field, value) {
    const item = components.find(c => c.id === id);
    if (field === 'name') {
      item[field] = value;
    } else if (field === 'included') {
      item[field] = value;
      render();
    } else {
      item[field] = sanitize(field, value);
      if (field === 'lIn' || field === 'wIn') {
        const raw = parseFloat(value) || 0;
        const warnEl  = document.getElementById(`warn-${field}-${id}`);
        const inputEl = document.getElementById(`inp-${field}-${id}`);
        const outOfRange = raw > 11 || raw < 0;
        if (warnEl)  warnEl.classList.toggle('visible', outOfRange);
        if (inputEl) inputEl.classList.toggle('input-error', outOfRange);
      }
    }
    save();
    calculateTotals();
  }

  function deleteComponent(id) {
    if (confirm('Remove this item?')) {
      components = components.filter(c => c.id !== id);
      save();
      render();
    }
  }

  function calculateTotals() {
    let totalArea = 0, totalCost = 0;

    components.forEach(item => {
      const area = (item.lFt + item.lIn / 12) * (item.wFt + item.wIn / 12);
      const cost = area * item.rate;

      const areaEl = document.getElementById(`area-${item.id}`);
      const costEl = document.getElementById(`cost-${item.id}`);
      if (areaEl) areaEl.innerText = `${area.toFixed(4)} sq. ft.`;
      if (costEl) costEl.innerText = `₹${cost.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

      if (item.included) { totalArea += area; totalCost += cost; }
    });

    document.getElementById('grand-area').innerText = totalArea.toFixed(4);
    document.getElementById('grand-cost').innerText = totalCost.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    document.getElementById('item-count').innerText = components.filter(c => c.included).length;
  }

  function addComponent() {
    components.push({ id: Date.now(), name: 'New Item', lFt: 0, lIn: 0, wFt: 0, wIn: 0, rate: 0, included: true });
    save();
    render();
    // Focus the new item's name field
    setTimeout(() => {
      const inputs = document.querySelectorAll('.component-name');
      if (inputs.length) inputs[inputs.length - 1].focus();
    }, 50);
  }

  function render() {
    const list = document.getElementById('component-list');

    if (components.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📐</div>
          <p>No items yet</p>
          <small>Click "Add New Item" to start tracking your interior components.</small>
        </div>`;
      calculateTotals();
      return;
    }

    list.innerHTML = '';
    components.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = `card${item.included ? '' : ' excluded'}`;
      card.innerHTML = `
        <div class="card-header">
          <label class="check-wrap" title="${item.included ? 'Click to exclude' : 'Click to include'}">
            <input type="checkbox" ${item.included ? 'checked' : ''}
                   onchange="updateValue(${item.id}, 'included', this.checked)">
            <div class="check-box"></div>
          </label>
          <span class="item-number">#${String(index + 1).padStart(2, '0')}</span>
          <input class="component-name" value="${item.name.replace(/"/g, '&quot;')}"
                 onchange="updateValue(${item.id}, 'name', this.value)"
                 placeholder="Item name…">
          <button class="btn-delete" onclick="deleteComponent(${item.id})" title="Delete item">×</button>
        </div>

        <div class="card-body">
          <div class="input-row">
            <div class="dim-group">
              <span class="section-label">Length</span>
              <div class="unit-inputs">
                <div class="input-box">
                  <span class="unit-label">Feet</span>
                  <input id="inp-lFt-${item.id}" type="number" min="0" value="${item.lFt}"
                         onchange="updateValue(${item.id}, 'lFt', this.value)" placeholder="0">
                </div>
                <div class="input-box">
                  <span class="unit-label">Inches</span>
                  <input id="inp-lIn-${item.id}" type="number" min="0" max="11" value="${item.lIn}"
                         onchange="updateValue(${item.id}, 'lIn', this.value)" placeholder="0">
                  <span class="field-warning" id="warn-lIn-${item.id}">Must be 0–11</span>
                </div>
              </div>
            </div>

            <div class="dim-group">
              <span class="section-label">Width</span>
              <div class="unit-inputs">
                <div class="input-box">
                  <span class="unit-label">Feet</span>
                  <input id="inp-wFt-${item.id}" type="number" min="0" value="${item.wFt}"
                         onchange="updateValue(${item.id}, 'wFt', this.value)" placeholder="0">
                </div>
                <div class="input-box">
                  <span class="unit-label">Inches</span>
                  <input id="inp-wIn-${item.id}" type="number" min="0" max="11" value="${item.wIn}"
                         onchange="updateValue(${item.id}, 'wIn', this.value)" placeholder="0">
                  <span class="field-warning" id="warn-wIn-${item.id}">Must be 0–11</span>
                </div>
              </div>
            </div>
          </div>

          <div class="rate-section">
            <div class="rate-wrap">
              <span class="section-label">Rate</span>
              <div class="rate-input-row">
                <span class="rate-prefix">₹</span>
                <input type="number" min="0" value="${item.rate}"
                       onchange="updateValue(${item.id}, 'rate', this.value)" placeholder="0">
                <span class="rate-suffix">/ sq.ft</span>
              </div>
            </div>
            <div class="result-summary">
              <div class="item-area" id="area-${item.id}">0.0000 sq. ft.</div>
              <div class="item-cost" id="cost-${item.id}">₹0.00</div>
            </div>
          </div>
        </div>
      `;
      list.appendChild(card);
    });

    calculateTotals();
  }

  render();
</script>
</body>
</html>
